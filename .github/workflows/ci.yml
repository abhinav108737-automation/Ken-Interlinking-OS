# Phase 0 CI.
#
# STATUS: authored but NEVER EXECUTED — this repository has no git remote, and
# pushing is an ASK-level action. Do not report this workflow as passing.
#
# Every job is self-hosted-friendly: no paid services, no secrets required.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  KEN_MODEL_PROVIDER: mock

jobs:
  backend:
    name: backend (pgvector image)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ken
          POSTGRES_PASSWORD: ken
          POSTGRES_DB: ken_interlink_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ken -d ken_interlink_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KEN_DATABASE_URL: postgresql+asyncpg://ken:ken@localhost:5433/ken_interlink_test
      KEN_TEST_DATABASE_URL: postgresql+asyncpg://ken:ken@localhost:5433/ken_interlink_test
      KEN_ENVIRONMENT: ci
      # A dead service container must fail the job, not skip every integration test.
      KEN_REQUIRE_INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" -c requirements.lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not live"

  # ADR-0003 guardrail: migration 0001 must succeed on a PostgreSQL that has
  # NO pgvector at all. If anyone adds CREATE EXTENSION to 0001, this fails.
  native-degraded-mode:
    name: Phase 0-1 schema without pgvector (ADR-0003, ADR-0010)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ken
          POSTGRES_PASSWORD: ken
          POSTGRES_DB: ken_interlink
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ken -d ken_interlink"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KEN_DATABASE_URL: postgresql+asyncpg://ken:ken@localhost:5433/ken_interlink
      KEN_REQUIRE_PGVECTOR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -c requirements.lock.txt
      # 0003 creates the vector extension (ADR-0010), so a server without
      # pgvector supports the Phase 0-1 schema only.
      - run: alembic upgrade 0002_content_inventory
      - run: alembic downgrade base
      - run: alembic upgrade 0002_content_inventory
      - name: "0003 must fail clearly without pgvector"
        run: "! alembic upgrade head"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web
      - run: npm run test -w apps/web
      - run: npm run build -w apps/web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile full config --quiet
      - run: docker compose --profile full --profile ollama-container config --quiet
