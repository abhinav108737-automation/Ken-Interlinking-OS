# Alembic configuration for the Ken Interlink OS.
#
# sqlalchemy.url is deliberately EMPTY. The database URL carries credentials,
# so it is never committed: migrations/env.py reads it from
# ken_core.config.get_settings().database_url (env var KEN_DATABASE_URL).
# Tests override it with:  alembic -x dburl=postgresql+asyncpg://... upgrade head

[alembic]
# %(here)s = the directory containing this file, so `alembic` works from any
# working directory (and the readiness probe can locate revisions).
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision ids are human-readable slugs (e.g. 0001_initial_events), passed
# explicitly with `alembic revision --rev-id <slug>`.
file_template = %%(rev)s
timezone = UTC
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
