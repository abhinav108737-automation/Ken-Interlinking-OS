[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ken-interlink"
version = "0.1.0"
description = "Ken Research Agentic Interlinking OS — self-hosted contextual interlinking platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "pyyaml==6.0.3",
  # Phase 1 HTML parsing (TRD.md section 2). MIT. Used with Python's built-in
  # html.parser backend only: no lxml/html5lib native code (ADR-0009).
  "beautifulsoup4==4.15.0",
  # Phase 4 supervisor / state machine (TRD.md section 2, ADR-0012). MIT. Only
  # StateGraph is used: no checkpointer package (langgraph-checkpoint-postgres
  # pulls psycopg, LGPL), and LangSmith tracing is refused at startup.
  "langgraph==1.2.12",
  # Phase 9 vector store (ADR-0017). Apache-2.0, as is the qdrant/qdrant server
  # image it talks to (pinned in docker-compose.yml to v1.19.1,
  # sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10).
  # Self-hosted on loopback: no managed vector database, no paid API. Qdrant was
  # on the forbidden list until ADR-0017; that prohibition is explicitly lifted
  # by the user's completion directive, and Neo4j, Redis, Kafka, Celery and
  # Temporal remain forbidden. Its transitive dependencies are all permissive:
  # grpcio and protobuf (Apache-2.0 / BSD-3), numpy and portalocker (BSD-3),
  # h2 / hpack / hyperframe (MIT).
  "qdrant-client==1.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.17.0",
  "mypy>=1.18,<1.19",
]

# ---------------------------------------------------------------------------
# Multi-root package discovery.
#
# TRD.md section 4 mandates the monorepo layout apps/, services/, agents/,
# contracts/. Plain pip has no workspace path-dependency mechanism (no poetry,
# no uv on this machine), so the repository ships ONE distribution whose
# packages are discovered across four roots. See docs/adr/ADR-0001.md.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["contracts/python", "services", "apps/api", "agents"]
include = ["ken_*"]
namespaces = false

[tool.setuptools.package-data]
# The first-party beacon is served verbatim from disk (Phase 7, ADR-0015 s1), so it must
# travel with the package: a wheel without it serves GET /k.js as a 500.
"ken_services.analytics.collector" = ["static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff 0.17 also formats Python code blocks inside Markdown. Exclude all Markdown:
# it once rewrote a user-authored governance file (.claude/agents/*.md).
extend-exclude = ["migrations/versions", "_research", ".venv", "*.md", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "A003",  # builtin-shadowing attribute names on Pydantic models
]
# NOTE: S101 (assert) is deliberately NOT ignored globally. `python -O` strips
# asserts, so an assert in production code is validation that silently
# disappears. It is allowed in tests only, via per-file-ignores below.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"infrastructure/scripts/*" = ["S603", "S607"]
# The simulated CMS interpolates only its own constant schema name (cms_sim) into SQL;
# every value is a bound parameter.
"services/ken_core/providers/cms/simulated.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["ken_contracts", "ken_core", "ken_services", "ken_api", "ken_agents"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# The four package roots (ADR-0001), so `mypy <single file>` resolves cross-root imports too.
mypy_path = "contracts/python:services:apps/api:agents"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["^migrations/versions/", "^_research/", "^\\.venv/"]
files = ["contracts/python", "services", "apps/api", "agents", "tests", "infrastructure/scripts"]

# Strict where the frozen contracts and the deterministic services live — docs/CONTRACTS.md —
# and, from Phase 4, the agent runtime (the LLM boundary).
[[tool.mypy.overrides]]
module = ["ken_contracts.*", "ken_core.*", "ken_services.*", "ken_agents.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# PyYAML ships no inline types. Ignoring its missing stubs avoids adding an
# unapproved dependency (types-PyYAML) for one test-only import.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires a reachable PostgreSQL database (auto-skips when absent)",
  "live: requires a reachable live Ollama daemon (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:ken_.*"]
