<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Off-site Canonical Example">
  <link rel="canonical" href="https://external.example.org/elsewhere">
</head>
<body>
  <main>
    <h1>A heading that is not the title</h1>
    <p>Syndicated copy; the original lives <a href="https://external.example.org/elsewhere">elsewhere</a>.</p>
  </main>
</body>
</html>
