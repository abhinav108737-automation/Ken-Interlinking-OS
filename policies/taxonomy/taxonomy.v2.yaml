entities: []
page_types:
- id: hub
  label: Home / listing page
  path_patterns:
  - ^/$
  - ^/(industry-reports|articles|case-studies|survey|pov|competition-benchmarking)/?$
  intent: navigational
  commercial_importance: 1
  linkable_as_source: false
- id: transactional
  label: Contact / enquiry / purchase
  path_patterns:
  - ^/(contact-us|talk-to-us|book-a-discovery-call|sample-report|dossier360)(/|$)
  intent: transactional
  commercial_importance: 1
  linkable_as_source: false
  linkable_as_target: false
- id: corporate
  label: Corporate / legal
  path_patterns:
  - ^/(about-us|careers|expert-panel|privacy-policy|terms-and-conditions)(/|$)
  intent: corporate
  commercial_importance: 0
  linkable_as_source: false
  linkable_as_target: false
- id: benchmark
  label: Competition benchmarking
  path_patterns:
  - ^/competition-benchmarking/
  intent: commercial_research
  commercial_importance: 3
- id: report
  label: Market research report
  path_patterns:
  - ^/industry-reports/
  - ^/[a-z0-9-]+-market/?$
  intent: commercial_research
  commercial_importance: 3
- id: survey
  label: Survey
  path_patterns:
  - ^/survey/
  intent: commercial_research
  commercial_importance: 2
- id: case_study
  label: Case study
  path_patterns:
  - ^/case-studies/
  intent: informational
  commercial_importance: 2
- id: pov
  label: Point of view
  path_patterns:
  - ^/pov/
  intent: informational
  commercial_importance: 2
- id: insight
  label: Article
  path_patterns:
  - ^/articles/
  intent: informational
  commercial_importance: 2
- id: brand_comparison
  label: Ken Research comparison page
  path_patterns:
  - ^/ken-research-vs-
  intent: commercial_research
  commercial_importance: 1
- id: consulting
  label: Consulting service page
  path_patterns:
  - ^/(consulting|procurement-research)(/|$)
  intent: commercial_research
  commercial_importance: 2
- id: other
  label: Other page
  path_patterns:
  - ^/
  intent: informational
  commercial_importance: 1
default_page_type: other
protections:
- id: legal-pages
  reason: Legal and policy pages are never modified.
  path_patterns:
  - ^/([a-z]{2}(-[a-z]{2})?/)?(privacy|privacy-policy|terms|terms-and-conditions|cookie-policy|legal|disclaimer)(\.(html?|php))?(/|$)
eligibility:
  min_words_source: 150
  min_words_target: 100
