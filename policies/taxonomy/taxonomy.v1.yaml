# Taxonomy policy v1 — Phase 2 content intelligence (ADR-0010).
#
# DATA, NOT CODE. The deterministic analyser classifies pages ONLY from this
# file: markets (industry tree), geographies, an entity gazetteer, page-type
# rules, protection rules and eligibility thresholds. It is validated on load by
# ken_contracts.intelligence.TaxonomyPolicy (unique ids, every reference resolves).
#
# PROVENANCE: illustrative seed taxonomy written for the local fixture and demo
# corpora (Ken-Research-style coverage: markets in India, Southeast Asia and the
# Middle East). It is NOT Ken Research's official taxonomy. Replace it with
# taxonomy.v2.yaml once Ken supplies its own (see NEXT_STEPS.md). Company names
# below are fictional.
#
# Changing anything means a NEW version file (taxonomy.v2.yaml), never an
# in-place edit: every stored analysis records the taxonomy version that produced
# it, so stale analyses are detectable and past results reproducible.

policy: taxonomy
version: 1
status: baseline
source: fixture

# --------------------------------------------------------------------------- markets
# Top-level nodes (no parent) are industries. Aliases are matched as whole
# words/phrases, case-insensitively. Relationship lists drive PRD 7.3 edges.
markets:
  - id: energy
    label: Energy & Utilities
    aliases: [energy sector, utilities, power sector]
    adjacent: [automotive, chemicals-materials]
  - id: renewable-energy
    label: Renewable Energy
    parent: energy
    aliases: [renewable energy, renewables, clean energy, green energy]
  - id: solar-power
    label: Solar Power
    parent: renewable-energy
    aliases: [solar power, solar energy, solar pv, photovoltaic, solar panels, rooftop solar]
    complementary: [energy-storage]
  - id: wind-power
    label: Wind Power
    parent: renewable-energy
    aliases: [wind power, wind energy, wind turbines, offshore wind, onshore wind]
    complementary: [energy-storage]
  - id: energy-storage
    label: Energy Storage
