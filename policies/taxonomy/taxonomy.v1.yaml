# --------------------------------------------------------------------------- page types
# The FIRST rule whose regex matches the URL path wins; default_page_type otherwise.
page_types:
  - id: hub
    label: Listing / hub page
    path_patterns: ['^/(reports|industry-reports|insights)/?$', '^/(industries|sectors|categories|tags)(/|$)', '^/$']
    intent: navigational
    commercial_importance: 1
    linkable_as_source: false
    linkable_as_target: true
  - id: report
    label: Market research report
    path_patterns: ['^/(industry-reports|reports)/']
    intent: commercial_research
    commercial_importance: 3
  - id: insight
    label: Insight / article
    path_patterns: ['^/(insights|blog|articles|news)/']
    intent: informational
    commercial_importance: 2
  - id: transactional
    label: Contact / enquiry
    path_patterns: ['^/(contact|enquiry|request-sample|pricing|checkout)(/|$)']
    intent: transactional
    commercial_importance: 1
    linkable_as_source: false
    linkable_as_target: false
  - id: corporate
    label: Corporate / legal
    path_patterns: ['^/(about|careers|team|privacy|terms|cookie-policy|legal)(/|$)']
    intent: corporate
    commercial_importance: 0
    linkable_as_source: false
    linkable_as_target: false
  - id: other
    label: Other page
    path_patterns: ['^/']
    intent: informational
    commercial_importance: 1
default_page_type: other

# --------------------------------------------------------------------------- protections
# Any match makes a page PROTECTED: no link may ever be inserted into or point
# at it, whatever a model or reviewer says. Operators can add manual protections.
#
# The CMS's OWN protection flag is NOT a policy rule: ingestion mirrors it as a
# `source: cms` protection on every document (ADR-0010 section 5). A policy rule
# reading the (immutable) version metadata would stay "sticky" after the CMS
# clears the flag. (v1 was edited once, before any production use, to remove
# that rule -- recorded in ADR-0010's revision note.)
protections:
  - id: legal-pages
    reason: Legal and policy pages are never modified.
    # Matched against the canonical path: percent-decoded, ;params removed,
    # case-folded. An optional locale prefix (/en/, /en-gb/) and .html/.htm/.php
    # suffixes are covered.
    path_patterns:
      - '^/([a-z]{2}(-[a-z]{2})?/)?(privacy|privacy-policy|privacy-notice|terms|terms-of-use|terms-of-service|terms-and-conditions|cookie-policy|cookies|cookie-notice|legal|disclaimer|gdpr)(\.(html?|php))?(/|$)'


# --------------------------------------------------------------------------- eligibility
eligibility:
  min_words_source: 120
  min_words_target: 60
