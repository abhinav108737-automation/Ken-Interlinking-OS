policy: taxonomy
version: 5
status: proposed
source: TEST ONLY. taxonomy.v3 plus the markets of the seven Ken Consulting demo reports, which v3 (derived from the kenresearch.com
  sitemap) does not cover. Adds automotive-aftermarket-distribution as the shared parent of tyre, lubricants and auto-components
  distribution, so the same market across Qatar, the Philippines and the UAE becomes visible. Not for production; the owner
  signs off taxonomy (item 26).
